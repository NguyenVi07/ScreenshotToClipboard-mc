name: Build and release

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          ./gradlew verifyReleaseVersion --no-daemon -PreleaseModVersion="$version"

      - name: Build both loaders
        run: ./gradlew :fabric:build :neoforge:build --no-daemon

      - name: Select release JARs
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F ' = ' '$1 == "mod_version" { print $2; exit }' gradle.properties)"
          mkdir -p release-artifacts
          for loader in fabric neoforge; do
            shopt -s nullglob
            jars=("$loader"/build/libs/*-"$loader"-"$version".jar)
            if (( ${#jars[@]} != 1 )); then
              printf 'Expected one %s JAR for version %s, found %s\n' "$loader" "$version" "${#jars[@]}" >&2
              exit 1
            fi
            cp "${jars[0]}" "release-artifacts/$loader-mc26.3-$version.jar"
          done
          cp CHANGELOG.md release-artifacts/CHANGELOG.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-to-clipboard-mc26.3-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error

  attach-release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built JARs
        uses: actions/download-artifact@v4
        with:
          name: screenshot-to-clipboard-mc26.3-${{ github.sha }}
          path: release-artifacts

      - name: Attach JARs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-artifacts/*.jar
          body_path: release-artifacts/CHANGELOG.md
          fail_on_unmatched_files: true
