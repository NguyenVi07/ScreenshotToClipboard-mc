plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "${rootProject.archives_name}-$project.name"
    }

    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
    }
}

tasks.register('verifyReleaseVersion') {
    doLast {
        def expected = providers.gradleProperty('releaseModVersion').orNull
        if (expected == null || expected != rootProject.mod_version) {
            throw new GradleException("Release version '$expected' does not match mod_version '${rootProject.mod_version}'")
        }
    }
}
